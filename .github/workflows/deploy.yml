name: deploy

# Deploys main to Cloudflare whenever it changes. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and R2 edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job exits early and does nothing. Only main ever deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; nothing deployed." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - if: steps.secrets.outputs.ready == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            vendor/neuma-src
            . -> target
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        id: rev
        run: echo "neuma=$(sed -n 's/^neuma = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/neuma
          key: neuma-module-${{ steps.rev.outputs.neuma }}
      - if: steps.secrets.outputs.ready == 'true'
        run: sh scripts/neuma.sh
      - if: steps.secrets.outputs.ready == 'true'
        run: sh scripts/cantor-wasm.sh
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: node content/build.mjs
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run build --workspace web
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run seed --workspace worker
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply cantor --remote
          npx wrangler d1 execute cantor --remote --file ../out/seed.sql
          npx wrangler deploy
