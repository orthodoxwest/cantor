<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cantor · sing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div class="controls">
        <button id="play" type="button" disabled>Play</button>
        <button id="listen" type="button">Listen</button>
        <output id="readout" aria-live="polite">–</output>
      </div>
      <p id="status" class="status" role="status"></p>
      <div id="score" class="score"></div>
      <section id="result" class="result" hidden>
        <p id="key"></p>
        <p id="base" hidden><span id="base-text"></span> <button id="rebase" type="button">Back to your key</button></p>
      </section>
    </main>
    <script type="module" src="/src/sing.ts"></script>
  </body>
</html>
