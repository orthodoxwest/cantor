<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Practice · Cantor</title>
    <meta name="description" content="Hear a chant sung, sing it yourself, and see where your voice went note by note." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/sing.css" />
  </head>
  <body>
    <header class="beam">
      <div class="beam-in">
        <a class="brand" href="/"><span class="cross" aria-hidden="true">✠</span>Cantor</a>
        <nav aria-label="Pages">
          <a href="/">Psalms</a>
          <a href="/library">Library</a>
          <a href="/sing" aria-current="page">Practice</a>
        </nav>
      </div>
    </header>

    <main>
      <p class="titulus" id="kicker">Practice</p>
      <h1 class="title" id="title">Practice</h1>
      <p class="lede">Press Play to hear it sung. Then press Listen and sing it yourself; stop when you are done to see where your voice went.</p>
      <label class="pick">Chant <select id="chant"></select></label>
      <p id="status" class="status" role="status"></p>
      <div id="score" class="score"></div>
      <section id="result" class="result" hidden>
        <p id="key"></p>
        <p id="base" hidden><span id="base-text"></span> <button id="rebase" class="btn" type="button">Back to your key</button></p>
      </section>
    </main>

    <div class="bar">
      <div class="bar-in">
        <button id="play" class="btn primary" type="button" aria-pressed="false" disabled>Play</button>
        <button id="listen" class="btn" type="button" aria-pressed="false">Listen</button>
        <span class="spacer"></span>
        <output id="readout" aria-live="polite">–</output>
      </div>
    </div>
    <script type="module" src="/src/sing.ts"></script>
  </body>
</html>
