<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The reader's own choice of light or dark, before the page is drawn; otherwise the system's.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script src="/theme.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Practice · Cantor</title>
    <meta name="description" content="Hear a chant sung, sing it yourself, and see where your voice went note by note." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/sing.css" />
  </head>
  <body>
    <header class="beam">
      <div class="beam-in">
        <a class="brand" href="/"><span class="cross" aria-hidden="true">✠</span>Cantor</a>
        <nav aria-label="Pages">
          <a href="/">Psalms</a>
          <a href="/library">Library</a>
          <a href="/sing" aria-current="page">Practice</a>
        </nav>
        <button type="button" class="theme" id="theme" aria-label="Light or dark" title="Light or dark">
          <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 1.4a6.6 6.6 0 1 0 4 10.9A5.6 5.6 0 0 1 10.6 1.4z" /></svg>
          <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" /><path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2M3 3l1.5 1.5M11.5 11.5 13 13M3 13l1.5-1.5M11.5 4.5 13 3" /></svg>
        </button>
      </div>
    </header>

    <main>
      <p class="titulus" id="kicker">Practice</p>
      <h1 class="title" id="title">Practice</h1>
      <p class="lede">Press Play to hear it sung. Then sing a take and see where your voice went, note by note.</p>
      <div class="pick">
        <label class="search">
          <span class="sr">Find another chant</span>
          <input type="search" id="find" placeholder="Find another chant" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-controls="found" aria-describedby="found-note" />
        </label>
        <ol class="found" id="found" hidden></ol>
        <p class="found-note"><span id="found-note" role="status"></span> <a href="/library">Browse the library</a></p>
      </div>
      <p class="mode"><span id="mode"></span> <label><input id="headphones" type="checkbox" /> Headphones</label></p>
      <p id="status" class="status" role="status"></p>
      <div id="score" class="score"></div>
      <p id="why" class="why" aria-live="polite"></p>
      <section id="result" class="result" hidden>
        <p id="summary"></p>
        <p id="key"></p>
        <p id="base" hidden><span id="base-text"></span> <button id="rebase" class="btn" type="button">Back to your key</button></p>
        <p id="send-line" class="send" hidden>
          <button id="send" class="btn" type="button">Send to a director</button>
          <span id="sent" aria-live="polite"></span>
        </p>
      </section>
    </main>

    <div class="bar">
      <div class="bar-in">
        <button id="play" class="btn primary" type="button" aria-pressed="false" disabled>Play</button>
        <button id="note" class="btn" type="button" aria-pressed="false" title="The first note, then the reciting tone if there is one" disabled>Start note</button>
        <button id="drone" class="btn" type="button" aria-pressed="false" title="A soft held tone on the reciting note, to sing against" disabled>Drone</button>
        <button id="take" class="btn" type="button" disabled>Sing a take</button>
        <span class="spacer"></span>
        <output id="readout" aria-live="polite">–</output>
      </div>
    </div>
    <script type="module" src="/src/sing.ts"></script>
  </body>
</html>
