<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Psalm pointer · Cantor</title>
    <meta name="description" content="Point an English psalm for any Gregorian tone, adjust the accents, hear it sung and take it away." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/pointer.css" />
  </head>
  <body class="pointer">
    <header class="beam">
      <div class="beam-in">
        <a class="brand" href="/"><span class="cross" aria-hidden="true">✠</span>Cantor</a>
        <nav aria-label="Pages">
          <a href="/" aria-current="page">Psalms</a>
          <a href="/library">Library</a>
          <a href="/sing">Practice</a>
        </nav>
      </div>
    </header>
    <main>
      <header class="head">
        <p class="titulus">Psalms</p>
        <h1 class="title">Psalm pointer</h1>
        <p class="lede">
          Choose a psalm and a tone. Each half-verse's cadence is underlined, its accents in bold:
          drag an accent, or focus it and use the arrow keys, to move it.
        </p>
      </header>
      <p id="print-title" class="print-title"></p>

      <div class="controls" role="group" aria-label="Psalm and tone">
        <label>Psalm <select id="psalm"></select></label>
        <label>Tone <select id="tone"></select></label>
        <label id="source-label" hidden>Pointing <select id="source"></select></label>
        <span id="range" class="range">
          <label>Verses <input id="from" type="number" inputmode="numeric" /></label>
          <label>to <input id="to" type="number" inputmode="numeric" /></label>
        </span>
        <label class="check"><input type="checkbox" id="gloria" checked /> Gloria Patri</label>
      </div>
      <label id="own-label" class="own" hidden>
        Your text, one verse per line with the mediant marked <code>*</code> (pointing marks are kept)
        <textarea id="own" rows="8" spellcheck="false"></textarea>
      </label>

      <figure class="tone-line">
        <figcaption id="tone-label"></figcaption>
        <div id="tone-score"></div>
      </figure>

      <div class="toolbar" role="toolbar" aria-label="Playback">
        <button id="play" class="btn primary" type="button" aria-pressed="false">Play</button>
        <label>Speed
          <select id="speed">
            <option value="0.6">Slow</option>
            <option value="0.45" selected>Steady</option>
            <option value="0.33">Brisk</option>
          </select>
        </label>
        <label>Pitch
          <select id="pitch"></select>
        </label>
        <span class="spacer"></span>
        <button id="undo" class="btn" type="button" disabled>Undo</button>
        <button id="check" class="btn" type="button" hidden></button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>

      <div id="verses" class="verses"></div>

      <div class="toolbar export" role="toolbar" aria-label="Export">
        <span class="label">Export</span>
        <button id="copy" class="btn" type="button" title="Copies the pointed verses with their red marks, to paste into Word">Copy for Word</button>
        <button id="download-text" class="btn" type="button">Text</button>
        <button id="download-gabc" class="btn" type="button">GABC</button>
        <button id="download-svg" class="btn" type="button">SVG</button>
        <button id="print" class="btn" type="button">Print</button>
      </div>

      <details id="notation">
        <summary>Notation</summary>
        <div id="score" class="score"></div>
      </details>
    </main>
    <script type="module" src="/src/pointer.ts"></script>
  </body>
</html>
