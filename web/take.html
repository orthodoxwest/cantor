<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The reader's own choice of light or dark, before the page is drawn; otherwise the system's.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script src="/theme.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A take · Cantor</title>
    <meta name="description" content="A sung take on its score: hear it, see where the voice went, and comment note by note." />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/sing.css" />
    <link rel="stylesheet" href="/src/take.css" />
  </head>
  <body>
    <header class="beam">
      <div class="beam-in">
        <a class="brand" href="/"><span class="cross" aria-hidden="true">✠</span>Cantor</a>
        <nav aria-label="Pages">
          <a href="/">Psalms</a>
          <a href="/library">Library</a>
          <a href="/sing">Practice</a>
        </nav>
        <button type="button" class="theme" id="theme" aria-label="Light or dark" title="Light or dark">
          <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 1.4a6.6 6.6 0 1 0 4 10.9A5.6 5.6 0 0 1 10.6 1.4z" /></svg>
          <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" /><path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2M3 3l1.5 1.5M11.5 11.5 13 13M3 13l1.5-1.5M11.5 4.5 13 3" /></svg>
        </button>
      </div>
    </header>

    <main>
      <p class="titulus" id="kicker">A take</p>
      <h1 class="title" id="title">A take</h1>
      <p id="status" class="status" role="status"></p>
      <section id="take" hidden>
        <p class="lede" id="lede">Listen to the take on its score. Tap a note to comment on it.</p>
        <audio id="audio" controls preload="metadata"></audio>
        <div id="score" class="score"></div>
        <p id="why" class="why" aria-live="polite"></p>
        <p id="jump" class="jump" hidden><a href="#comment" id="jump-link"></a></p>
        <section id="result" class="result">
          <p id="summary"></p>
          <p id="key"></p>
        </section>
        <section class="comments" aria-labelledby="comments-title">
          <h2 id="comments-title">Comments</h2>
          <ol id="comments"></ol>
          <form id="comment" class="comment-form">
            <label class="note-pick">Note <input id="note" type="number" min="1" step="1" required inputmode="numeric" /></label>
            <span id="note-words" class="note-words"></span>
            <label class="sr" for="body">Comment</label>
            <textarea id="body" rows="3" maxlength="2000" required placeholder="A comment on this note"></textarea>
            <label class="name-pick" id="name-line" hidden>Your name <input id="name" type="text" maxlength="60" autocomplete="name" placeholder="As the singer will see it" /></label>
            <button class="btn primary" type="submit">Post</button>
          </form>
          <p id="sign-line" class="sign-line" hidden><a id="sign-link" href="/signin">Sign in</a> to put your name to your comments.</p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/take.ts"></script>
  </body>
</html>
