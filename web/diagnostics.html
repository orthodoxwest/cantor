<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The reader's own choice of light or dark, before the page is drawn; otherwise the system's.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script src="/theme.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Diagnostics · Cantor</title>
    <meta name="description" content="How this browser hears and plays sound: the microphone's settings, latency and level, checked before practising." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/diagnostics.css" />
  </head>
  <body>
    <header class="beam">
      <div class="beam-in">
        <a class="brand" href="/"><span class="cross" aria-hidden="true">✠</span>Cantor</a>
        <nav aria-label="Pages">
          <a href="/">Psalms</a>
          <a href="/library">Library</a>
          <a href="/sing">Practice</a>
        </nav>
        <button type="button" class="theme" id="theme" aria-label="Light or dark" title="Light or dark">
          <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 1.4a6.6 6.6 0 1 0 4 10.9A5.6 5.6 0 0 1 10.6 1.4z" /></svg>
          <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" /><path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2M3 3l1.5 1.5M11.5 11.5 13 13M3 13l1.5-1.5M11.5 4.5 13 3" /></svg>
        </button>
      </div>
    </header>

    <main>
      <p class="titulus">Practice</p>
      <h1 class="title">Diagnostics</h1>
      <p class="lede">How this browser hears and plays sound. Turn the volume up, take out headphones, and keep quiet: the check plays three short beeps and listens for them.</p>
      <p><button id="check" class="btn primary" type="button">Check</button></p>
      <p id="status" class="status" role="status"></p>
      <section id="report" hidden>
        <table id="table" class="diagnostics" aria-label="What this browser said and what the check measured"></table>
        <p class="actions" id="actions" hidden>
          <button id="copy" class="btn" type="button">Copy as text</button>
          <button id="send" class="btn" type="button">Send</button>
          <span id="sent" aria-live="polite"></span>
        </p>
        <p class="note">Sending keeps this table and the browser's name with it; nothing else about you.</p>
      </section>
    </main>
    <script type="module" src="/src/diagnostics.ts"></script>
  </body>
</html>
