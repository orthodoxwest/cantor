[workspace]
resolver = "3"
members = ["crates/cantor-core", "crates/cantor-cli", "crates/cantor-crepe", "crates/cantor-ear", "crates/cantor-swift", "crates/cantor-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orthodoxwest/cantor"
publish = false

[workspace.dependencies]
cantor-core = { path = "crates/cantor-core" }
cantor-crepe = { path = "crates/cantor-crepe" }
cantor-ear = { path = "crates/cantor-ear" }
cantor-swift = { path = "crates/cantor-swift" }
# neuma is pinned by revision; scripts/neuma.sh builds the matching browser module.
neuma = { git = "https://github.com/orthodoxwest/neuma", rev = "2d6d8a3b42daa9e8f88615ef86c885a8839c0578" }
neuma-tones = { git = "https://github.com/orthodoxwest/neuma", rev = "2d6d8a3b42daa9e8f88615ef86c885a8839c0578" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
claxon = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.wasm]
inherits = "release"
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The core's signal code is slow unoptimized; tests and `cantor eval` run it optimized.
[profile.dev.package.cantor-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
